<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPL 2026 Fantasy Leaderboard</title>
    <meta name="description" content="Official IPL 2026 Fantasy Leaderboard Dashboard. Track live scores and rankings.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-container">
                <img id="ipl-logo" src="assets/ipl_logo.jpg" alt="IPL 2026 Logo">
                <div class="header-text">
                    <h1>IPL 2026</h1>
                    <p>FANTASY LEADERBOARD</p>
                </div>
            </div>
            
            <nav class="tab-nav">
                <button id="tab-leaderboard" class="tab-btn active">LEADERBOARD</button>
                <button id="tab-matches" class="tab-btn">ALL MATCHES</button>
            </nav>
        </header>

        <!-- Stats Overview -->
        <section id="stats-section" class="stats-overview">
            <div class="stat-card">
                <p class="stat-label">TOTAL PLAYERS</p>
                <div id="total-players" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <p class="stat-label">TOP SCORE</p>
                <div id="top-score" class="stat-value">0</div>
            </div>
        </section>

        <!-- Main Dashboard View -->
        <main id="main-view" class="leaderboard-section">
            <div class="leaderboard-header">
                <span class="rank">#</span>
                <span class="player">Player</span>
                <span class="points">Points</span>
            </div>
            <div id="leaderboard-list" class="leaderboard-list">
                <div class="loading-shimmer">
                    <div class="shimmer-item"></div>
                    <div class="shimmer-item"></div>
                    <div class="shimmer-item"></div>
                </div>
            </div>
        </main>

        <!-- All Matches View -->
        <section id="all-matches-view" class="matches-grid-section hidden">
            <div id="all-matches-list" class="matches-grid"></div>
        </section>

        <!-- Match Individual Results View (Hidden by default) -->
        <section id="match-individual-view" class="details-section hidden">
            <header class="details-header">
                <button id="back-to-matches-btn" class="back-button">←</button>
                <div class="details-title">
                    <h2 id="match-details-title">Match 1 Breakdown</h2>
                    <p id="match-details-subtitle">RCB vs SRH</p>
                </div>
            </header>
            <div class="matches-container">
                <div class="match-header">
                    <span>Rank</span>
                    <span>Player</span>
                    <span>Points</span>
                </div>
                <div id="match-player-list" class="matches-list">
                    <!-- Match performance here -->
                </div>
            </div>
        </section>

        <!-- Player Details View (Hidden by default) -->
        <section id="details-view" class="details-section hidden">
            <header class="details-header">
                <button id="back-btn" class="back-button">←</button>
                <div class="details-title">
                    <h2 id="details-name">Player Name</h2>
                    <p id="details-total-points">0 Points</p>
                </div>
            </header>
            <div class="matches-container">
                <div class="match-header">
                    <span>M#</span>
                    <span>Matchup</span>
                    <span>Earned</span>
                </div>
                <div id="matches-list" class="matches-list">
                    <!-- Match data here -->
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p id="update-match-info">Points updated after Match...</p>
            <p>Last updated: <span id="last-update-time">--</span></p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
