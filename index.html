<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPL 2026 Fantasy Leaderboard</title>
    <meta name="description" content="Official IPL 2026 Fantasy Leaderboard Dashboard. Track live scores and rankings.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-container">
                <img id="ipl-logo" src="assets/ipl_logo.jpg" alt="IPL 2026 Logo">
                <div class="header-text">
                    <h1>IPL 2026</h1>
                    <p>FANTASY LEADERBOARD</p>
                </div>
            </div>

        </header>

        <!-- Stats Overview -->
        <section class="stats-overview">
            <div class="stat-card gold">
                <span class="stat-label">Total Players</span>
                <span id="total-players" class="stat-value">--</span>
            </div>
            <div class="stat-card blue">
                <span class="stat-label">Top Score</span>
                <span id="top-score" class="stat-value">--</span>
            </div>
        </section>

        <!-- Main Dashboard View -->
        <main id="main-view" class="leaderboard-section">
            <div class="leaderboard-header">
                <span class="rank">#</span>
                <span class="player">Player</span>
                <span class="points">Points</span>
            </div>
            <div id="leaderboard-list" class="leaderboard-list">
                <div class="loading-shimmer">
                    <div class="shimmer-item"></div>
                    <div class="shimmer-item"></div>
                    <div class="shimmer-item"></div>
                </div>
            </div>
        </main>

        <!-- Player Details View (Hidden by default) -->
        <section id="details-view" class="details-section hidden">
            <header class="details-header">
                <button id="back-btn" class="back-button">←</button>
                <div class="details-title">
                    <h2 id="details-name">Player Name</h2>
                    <p id="details-total-points">0 Points</p>
                </div>
            </header>
            <div class="matches-container">
                <div class="match-header">
                    <span>M#</span>
                    <span>Matchup</span>
                    <span>Earned</span>
                </div>
                <div id="matches-list" class="matches-list">
                    <!-- Match data here -->
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p id="update-match-info">Points updated after Match...</p>
            <p>Last updated: <span id="last-update-time">--</span></p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
