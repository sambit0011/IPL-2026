<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPL 2026 Fantasy Leaderboard</title>
    <meta name="description" content="Official IPL 2026 Fantasy Leaderboard Dashboard. Track live scores and rankings.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-container">
                <img id="ipl-logo" src="assets/ipl_logo.jpg" alt="IPL 2026 Logo">
                <div class="header-text">
                    <h1>IPL 2026</h1>
                    <p>FANTASY LEADERBOARD</p>
                </div>
            </div>

        </header>

        <!-- Tab Navigation -->
        <nav class="tabs-nav">
            <button id="tab-leaderboard" class="tab-btn active">Leaderboard</button>
            <button id="tab-matches" class="tab-btn">All Matches</button>
        </nav>

        <!-- Stats Overview (Hidden on details) -->
        <div id="overview-stats">
            <section class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">TOTAL PLAYERS</p>
                    <h3 id="total-players">0</h3>
                </div>
                <div class="stat-card">
                    <p class="stat-label">TOP SCORE</p>
                    <h3 id="top-score">0</h3>
                </div>
            </section>
        </div>

        <!-- Main Dashboard View -->
        <main id="main-view" class="leaderboard-section">
            <div class="leaderboard-header">
                <span class="rank">#</span>
                <span class="player">Player</span>
                <span class="points">Points</span>
            </div>
            <div id="leaderboard-list" class="leaderboard-list">
                <div class="loading-shimmer">
                    <div class="shimmer-item"></div>
                    <div class="shimmer-item"></div>
                    <div class="shimmer-item"></div>
                </div>
            </div>
        </main>

        <!-- All Matches View (Hidden by default) -->
        <main id="matches-view" class="leaderboard-section hidden">
            <div class="leaderboard-header">
                <span class="rank">#</span>
                <span class="player">Match</span>
                <span class="points">Date/Status</span>
            </div>
            <div id="all-matches-list" class="leaderboard-list">
                <!-- Matches will be injected here -->
            </div>
        </main>

        <!-- Match Specific Leaderboard View (Hidden by default) -->
        <section id="match-details-view" class="details-section hidden">
            <header class="details-header">
                <button id="match-back-btn" class="back-button">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="header-text">
                    <h2 id="match-details-name" class="player-name">--</h2>
                    <p id="match-details-label" class="total-points">Match Results</p>
                </div>
            </header>

            <div class="matches-container">
                <div class="match-header" style="grid-template-columns: 50px 1fr 100px;">
                    <span>Rank</span>
                    <span>Player</span>
                    <span>Points</span>
                </div>
                <div id="match-leaderboard-list" class="matches-list">
                    <!-- Match Rankings here -->
                </div>
            </div>
        </section>

        <!-- Player Details View (Hidden by default) -->
        <section id="details-view" class="details-section hidden">
            <header class="details-header">
                <button id="back-btn" class="back-button">←</button>
                <div class="details-title">
                    <h2 id="details-name">Player Name</h2>
                    <p id="details-total-points">0 Points</p>
                </div>
            </header>
            <div class="matches-container">
                <div class="match-header">
                    <span>M#</span>
                    <span>Matchup</span>
                    <span>Earned</span>
                </div>
                <div id="matches-list" class="matches-list">
                    <!-- Match data here -->
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p id="update-match-info">Points updated after Match...</p>
            <p>Last updated: <span id="last-update-time">--</span></p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
